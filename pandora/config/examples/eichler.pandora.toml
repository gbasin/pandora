# Eichler's routed boundary for the v0.2 slice.
#
# In v0.2 final this file lives at the eichler repository root, where the loader
# looks first. For the slice it lives outside the repository -- copied to
# ~/.config/pandora/repos/eichler.pandora.toml and named by the enrolment --
# because the combined Eichler PR has not landed and the slice is not allowed to
# open it.
#
# What is here and not in ci.yml: which argv forms Pandora claims, how big the
# job is, which arguments the repository itself gets to veto before anything
# queues, and which paths come home. What is deliberately absent: service
# containers and the network pod. A run is a machine with its own dockerd, so
# `journey-runner.mjs` boots eichler's own compose stack unmodified and there is
# nothing for Pandora to wire.

version = 1

[repo]
name = "eichler"
entrypoints = ["pnpm"]
root_markers = ["pnpm-workspace.yaml", "turbo.json"]

[matching]
strip_prefixes = [["run"], ["validate"]]
# A subdirectory invocation runs locally with a notice rather than being
# re-rooted: re-rooting silently changes which files a selector names, and the
# direction note chose the honest option.
subdirectory = "local"

[feedback]
reject_suffix = "No validation started."
extra_message = "{job} runs as one complete suite and takes no selectors."

# There is no repository-wide `[fallback]` table on purpose. One here answers
# for every job at once, and on 2026-09-22 that answer ran a 302-test browser
# suite on this Mac because a submission was refused. A job that says nothing is
# decided by its size class -- `small` and `medium` go to the local lane,
# `large` does not -- and a job that wants a different answer says so below.

[env]
set = { CI = "true", WRANGLER_SEND_METRICS = "false" }
passthrough = ["TZ"]
unset = []
reject_if_set = []

[secrets]
exclude_globs = [".dev.vars", ".dev.vars.*", "**/.env", "**/.env.*", "**/*.pem", "**/.npmrc"]

# What a golden instance for this repository contains. The fingerprint of this
# table is the golden's name, so changing any line here mints a new golden
# rather than silently reusing a stale one.
[worker]
base_image = "images:ubuntu/26.04"
packages = ["docker.io", "docker-compose-v2", "docker-buildx", "ca-certificates",
            "curl", "xz-utils", "git", "python3", "jq", "rsync"]
node_version = "24.9.0"
pnpm_version = "12.3.4"
service_images = ["postgres:16", "edoburu/pgbouncer:latest",
                  "ghcr.io/neondatabase/wsproxy:latest"]
install_command = "pnpm install --frozen-lockfile 2>&1 | tail -2"
source_id = "eichler-journey-runner-proxy"
workdir = "/work"

[[jobs]]
id = "journey"
summary = "One service-backed journey"
size = "large"
args = "required"
# A journey boots a compose stack. It is not run on this Mac when the worker
# will not take it, whatever the reason; the size class would say so anyway and
# this says it where a reader is looking.
fallback = "refuse"
# The stack needs time to come down. 240 s is what eichler's own planner asked
# Pueue for, expressed here once for both lanes.
cancel = { signal = "SIGTERM", grace_ms = 240000 }
usage = "Use pnpm journey <id> [--fault dropped]; other journey options are not routed."
timeout_minutes = 30
forms = [{ prefix = ["journey"] }]
value_flags = ["--fault"]
reject_if_set = ["JOURNEY_FILTER", "JOURNEY_SHARD", "JOURNEY_CONCURRENCY",
                 "JOURNEY_REPLAY", "JOURNEY_TEMPLATE", "IKE_WORLD"]
options = [{ name = "--update", sets = "update", forward = true, writeback = true }]
# Asked in the worktree, in milliseconds, before anything is frozen or queued.
# Exit 0 means "I would run this"; anything else is the repository's own refusal
# and its stderr is the message the agent sees.
validate = { argv = ["node", "tools/validation/journey-runner.mjs", "validate", "{args}"], timeout_ms = 4000 }
run = { argv = ["node", "tools/validation/journey-runner.mjs", "run", "{args}"], unset = ["CI"], env = { JOURNEY_REPLAY = "cover" } }
outputs = [
  { kind = "artifacts", paths = ["packages/scenarios/.journeys"] },
  { kind = "writeback", requires_option = "update", paths = [
    "packages/scenarios/fixtures/*.ledger.jsonl",
    "packages/scenarios/fixtures/write-routes.json",
  ] },
]

# --- tier 1: the tooling suites --------------------------------------------
#
# Two jobs with no sharding, no plan step and no services: one instance, one
# command, one exit code. They are here because they are what an agent actually
# types, dozens of times a day, and because a tooling suite is the case the
# 1-CPU quota of v0.1.1 got worst -- so they are also the measurement that says
# whether CPU-by-weight fixed it. `notes/v0.2-check-profile-2026-09-22.md` has
# the numbers and the reasoning behind each `where` below.

[[jobs]]
id = "check"
summary = "The static checks CI runs"
# Measured 2026-09-22: on a four-core worker with a warm turbo cache a remote
# `check` is faster in wall clock than the same check on a loaded Mac, and not
# much slower on an idle one. `remote` is the default because the Mac's load is
# the common case, not the exception.
where = "remote"
# `large` would keep it out of the local lane on fallback, and that is the wrong
# answer for a suite whose whole job is to be run constantly: when the worker
# cannot take it, running it here beats refusing it.
size = "medium"
args = "none"
timeout_minutes = 45
# `pnpm check` and `pnpm validate check` are one form: `[matching] strip_prefixes`
# has already removed `validate` by the time a form is matched.
#
# KNOWN OVER-RUN, recorded rather than hidden: a job has one `run`, so all three
# forms execute the full `check`. Asking for `check:docs` therefore also pays for
# lint and typecheck. With a warm turbo cache that is ~10 s; cold it is the whole
# suite. The fix is one loader change -- a per-form `run` override, or three jobs
# sharing a validator -- and it is not in this slice.
forms = [{ prefix = ["check"] }, { prefix = ["check:docs"] }, { prefix = ["check:code"] }]
# The cheapest existing pre-check that rejects a bad suite name: eichler's own
# planner, asked to plan rather than to run. Measured at 45-52 ms, and it exits
# 1 with the repository's own message on an unknown suite. It reads no lockfile
# and installs nothing, which is what makes it safe on the submission path.
validate = { argv = ["node", "tools/validate.mjs", "plan", "check"], timeout_ms = 3000 }
# The run needs *a* git repository, not eichler's. `tools/validate.mjs` calls
# `fingerprint(root)` unconditionally -- `git rev-parse HEAD`, `git diff HEAD`,
# `git ls-files --others` -- and a run's source tree arrives without `.git`,
# because shipping eichler's history costs more than every suite it would
# validate. So the run makes one: `git init && git add -A && git commit`, after
# which rev-parse answers and both `git diff HEAD` and `git ls-files --others`
# are empty, so the fingerprint itself costs milliseconds. The bootstrap costs
# what one `git add -A` over the worktree costs, measured and reported in the
# note as a fixed per-run tax. Excluding everything instead (`info/exclude` =
# `*`) is cheaper and wrong: oxfmt and oxlint read the same ignore rules and
# would then format-check nothing while exiting 0.
#
# It is *load-bearing that this is a stub*. eichler's fingerprint exists to
# notice a tree edited while its own validation ran, and on the worker Pandora
# already answers that question with `drift`. The one-line eichler change that
# would delete these seventeen words of shell: let `fingerprint` return a
# constant when `git rev-parse HEAD` fails, instead of throwing.
run = { argv = ["bash", "-lc", "git config --global --add safe.directory \"$PWD\" >/dev/null 2>&1; if ! git rev-parse HEAD >/dev/null 2>&1; then git init -q . && git add -A && git -c user.email=pandora@localhost -c user.name=pandora commit -qm pandora-run; fi; exec pnpm validate check"], env = { EICHLER_QUEUE = "direct" } }
# Turbo writes into its own cache while it runs, which is a tree change a
# `drift = "fail"` machine would refuse. `warn` is the honest setting for a job
# that edits nothing a verdict depends on.
drift = "warn"

[[jobs]]
id = "native-unit"
summary = "The Expo app's Jest units"
# Measured 2026-09-22. Unlike `check`, this suite has no turbo cache to warm:
# it is one `jest` process, so every run pays the same price and the comparison
# is a straight CPU one.
where = "remote"
size = "medium"
# The unfiltered form only. `pnpm test:native-unit <selectors>` is what AGENTS.md
# tells an agent to use while iterating, and a focused Jest run is seconds of
# this Mac against a whole worktree freeze and transfer -- so extra arguments
# fall out of the claim rather than being rejected.
args = "none"
on_extra = { action = "local" }
timeout_minutes = 30
forms = [{ prefix = ["test:native-unit"] }, { prefix = ["native-unit"] }]
validate = { argv = ["node", "tools/validate.mjs", "plan", "native-unit"], timeout_ms = 3000 }
# The same stub repository as `check` above, and for the same reason.
run = { argv = ["bash", "-lc", "git config --global --add safe.directory \"$PWD\" >/dev/null 2>&1; if ! git rev-parse HEAD >/dev/null 2>&1; then git init -q . && git add -A && git -c user.email=pandora@localhost -c user.name=pandora commit -qm pandora-run; fi; exec pnpm validate native-unit"], env = { EICHLER_QUEUE = "direct" } }
drift = "warn"

# --- the local lane ---------------------------------------------------------
#
# Work that stays on this Mac but still has to be *scheduled*. `where = "local"`
# hands it to the client daemon's own executor: the same queue, the same memory
# admission, the same receipt, the same `pandora ps/wait/cancel/logs` and the
# same exit-code contract as a routed job -- and no Pueue.
#
# Each of these runs eichler's existing validation planner with
# `EICHLER_QUEUE=direct`, which is the planner's "you are already the scheduled
# process" mode. Pandora owns the queue; eichler still owns what the suite is,
# which selectors are legal, and its own source-fingerprint receipt.

[[jobs]]
id = "validate-node"
summary = "Focused node --test files"
where = "local"
size = "small"
args = "required"
timeout_minutes = 20
usage = "Use pnpm validate node <test-file.mjs> [...files]."
forms = [{ prefix = ["node"] }]
# Freezing 4,900 files twice costs more than this job does. The recommendation
# for every `small` job: turn the drift check off and let the receipt say so.
drift = "off"
cancel = { signal = "SIGINT", grace_ms = 5000 }
# eichler's planner is the only thing that knows a node test file from a flag,
# and it answers in milliseconds without an install.
validate = { argv = ["node", "tools/validate.mjs", "plan", "node", "{args}"], timeout_ms = 5000 }
run = { argv = ["pnpm", "validate", "node", "{args}"], env = { EICHLER_QUEUE = "direct" } }

[[jobs]]
id = "unit"
summary = "Focused Vitest units"
where = "local"
size = "medium"
args = "optional"
timeout_minutes = 30
forms = [{ prefix = ["test:unit"] }, { prefix = ["unit"] }]
validate = { argv = ["node", "tools/validate.mjs", "plan", "unit", "{args}"], timeout_ms = 5000 }
run = { argv = ["pnpm", "validate", "unit", "{args}"], env = { EICHLER_QUEUE = "direct" } }
# The cleanup markers, declared rather than discovered. This is the answer to
# "should the local lane set EICHLER_VALIDATION_DIRECTORY": no. A job that
# writes a marker says where it writes it, and the receipt records whether it
# was there -- so an unclean run is a line in `pandora result`, not a directory
# somebody has to know to look in.
outputs = [{ kind = "evidence", paths = ["tmp/validation/*/cleanup-required",
                                         "tmp/validation/*/result.json"] }]

# The development stack is a *long-lived* local job: one per machine, alive
# until someone cancels it. That is the whole of what `eichler-stacks` was,
# expressed as `singleton` rather than as a Pueue group of one slot.
[[jobs]]
id = "dev-stack"
summary = "The development stack, one per machine"
where = "local"
singleton = true
size = "large"
args = "optional"
timeout_minutes = 1440
forms = [{ prefix = ["dev:stack"] }]
# Ports, containers and a database to release. It gets a minute, and SIGINT
# because that is what its own teardown listens for.
cancel = { signal = "SIGINT", grace_ms = 60000 }
drift = "off"
reject = [{ args = ["status", "logs", "stop", "prune"], message = "The stack is a pandora run now: `pandora ps` lists it, `pandora logs <id>` follows it, `pandora cancel <id>` stops it with its own teardown." }]
run = { argv = ["node", "tools/stack/stack.mjs", "--foreground", "{args}"] }
