# Pandora routes its own test suite. Agents run it as
#
#   pandora run -- python3 -m unittest discover -s pandora
#
# `repo.entrypoints` is the shim's tool, and the shim ships only for `pnpm`.
# `pandora run` sends the request as `pnpm <argv>`, so the daemon strips the
# `pnpm` entrypoint and matches the rest against the form below. Typing the
# command without `pandora run` is not routed: no `python3` shim exists.
version = 1

[repo]
name = "pandora"
entrypoints = ["pnpm"]

# The golden for the suite: an interpreter, git for the tests that build
# repositories, rsync for the transfer tests, and ssh-keygen for the verdict
# tests. docker.io is not for the suite: every golden build starts dockerd and
# fails without it. No Node and no pnpm: node_version and pnpm_version are
# optional, and leaving them out installs neither.
[worker]
base_image = "images:ubuntu/26.04"
packages = ["docker.io", "git", "python3", "rsync", "openssh-client"]

# A signed verdict for this job lets the ubuntu leg of tests.yml skip the
# suite for the same tree (.github/actions/pandora-verdict). It needs the
# worker's tree, so the job runs with a synthetic git repository.
[[jobs]]
id = "suite"
summary = "Pandora's unittest suite"
where = "remote"
git = "synthetic"
args = "none"
# Never run the whole suite on this Mac as a fallback: two suites at once hang it.
fallback = "refuse"
timeout_minutes = 30
forms = [{ prefix = ["python3", "-m", "unittest", "discover", "-s", "pandora"] }]
run = { argv = ["python3", "-m", "unittest", "discover", "-s", "pandora"] }

# An isolated source-transfer experiment. It generates synthetic data only on
# the worker, never reads production source caches, and returns a JSON artifact.
[[jobs]]
id = "transfer-profile"
summary = "Measure scratch rsync checksum and cache reuse costs"
where = "remote"
size = "medium"
args = "none"
fallback = "refuse"
timeout_minutes = 15
forms = [{ prefix = ["python3", "experiments/transfer-profile/benchmark.py"] }]
run = { argv = ["python3", "experiments/transfer-profile/benchmark.py"] }
outputs = [{ kind = "artifacts", paths = ["artifacts/transfer-profile.json"] }]

# A controlled scratch CAS comparison. Source and stores exist only inside the
# disposable job container. Production transfer code and source caches are unused.
[[jobs]]
id = "cas-poc"
summary = "Compare scratch CAS integrity policies with rsync"
where = "remote"
size = "medium"
args = "none"
fallback = "refuse"
timeout_minutes = 15
forms = [{ prefix = ["python3", "experiments/cas-poc/benchmark.py"] }]
run = { argv = ["python3", "experiments/cas-poc/benchmark.py"] }
outputs = [{ kind = "artifacts", paths = ["artifacts/cas-poc.json"] }]

[[jobs]]
id = "cas-delta-probe"
summary = "Measure whole-blob upload after a tiny large-file edit"
where = "remote"
size = "medium"
args = "none"
fallback = "refuse"
timeout_minutes = 15
forms = [{ prefix = ["python3", "experiments/cas-poc/delta_probe.py"] }]
run = { argv = ["python3", "experiments/cas-poc/delta_probe.py"] }
outputs = [{ kind = "artifacts", paths = ["artifacts/cas-delta-probe.json"] }]

[verdicts]
publish = true
