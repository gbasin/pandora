name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A daily canary: a silently broken routed path is worse than a loud one.
    - cron: '23 7 * * *'

jobs:
  selftest:
    # The worker-e2e runner: pandora-ci@localhost with an own engine_root.
    runs-on: [self-hosted, e2e]
    timeout-minutes: 45    # a cold selftest golden build takes minutes
    steps:
      - uses: actions/checkout@v4
      - name: pandora selftest
        run: bin/pandora --config /home/gh-runner/.config-pandora-e2e.toml selftest --update --queue --timeout 1800

  gateway:
    # The same worker reached through a key pinned to bin/gateway --name
    # pandora-ci-user. The script skips with a notice until the runner is
    # provisioned (its header lists the four pieces).
    needs: selftest
    runs-on: [self-hosted, e2e]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: teammate gateway
        run: scripts/e2e-gateway.sh
