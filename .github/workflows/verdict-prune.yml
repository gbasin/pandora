name: verdict-prune

# A reusable workflow that deletes signed Pandora verdict refs
# (refs/pandora/verdicts/<tree>/<job>) older than max_age_days from the
# calling repository. Call it from a weekly schedule (docs/verdicts.md,
# Pruning). The calling job grants `contents: write`; nothing else needs it.
#
# Age is the `finished` field of each verdict's payload.json. Every verdict
# commit is dated `@1 +0000`, so the commit date says nothing.
# scripts/verdict-prune.sh holds the logic and the unit tests drive it.

on:
  workflow_call:
    inputs:
      max_age_days:
        description: Delete verdict refs whose run finished more than this many days ago. At least 1.
        type: number
        required: false
        default: 30
      dry_run:
        description: Print what would be deleted and delete nothing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The calling repository, for its remote and the token that may push.
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      # This workflow's own repository at this workflow's own commit, for the
      # script. Without both values the checkout would fall back to the
      # default branch, an unpinned script, so stop instead.
      - name: this workflow's commit is known
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo '::error::job.workflow_repository or job.workflow_sha is empty'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: pandora-tools
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/verdict-prune.sh
          sparse-checkout-cone-mode: false
      - name: prune verdict refs
        working-directory: repo
        env:
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # 0 would delete every verdict. The script refuses it too.
          if ! [[ $MAX_AGE_DAYS =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_age_days must be a whole number of at least 1: $MAX_AGE_DAYS"
            exit 1
          fi
          args=(--remote origin --max-age-days "$MAX_AGE_DAYS")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          bash "$GITHUB_WORKSPACE/pandora-tools/scripts/verdict-prune.sh" "${args[@]}"
