name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # A signed Pandora verdict for this exact tree stands in for the unittest
      # step on ubuntu (docs/operations.md, Verdicts in CI). The action fetches
      # what it needs at depth 1, so the checkout stays shallow. It never fails.
      - name: pandora verdict
        id: verdict
        if: runner.os == 'Linux'
        uses: ./.github/actions/pandora-verdict
        with:
          job: suite
          argv: '["python3","-m","unittest","discover","-s","pandora"]'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: ruff
        run: |
          python3 -m pip install ruff==0.15.1
          ruff check --select F,E9 . --exclude experiments
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || {
            if [ "$(uname)" = Linux ]; then sudo apt-get install -y shellcheck;
            else brew install shellcheck; fi
          }
          # SC3013: -nt is deliberate; dash and bash have had it for decades.
          shellcheck -e SC3013 bin/pnpm bin/pandora scripts/verdict-verify.sh scripts/verdict-prune.sh
      - name: unittest
        if: runner.os != 'Linux' || steps.verdict.outputs.verified != 'true'
        run: python3 -m unittest discover -s pandora
