# Trimmed verbatim copy of eichler .github/workflows/ci.yml (596 lines, 2026-09-21).
# Only the four jobs the import POC reads are kept; every retained line is
# byte-identical to the source, including the `needs`/`if` gating this importer
# deliberately ignores.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.full_suite == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ike_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: ike
          POSTGRES_HOST_AUTH_METHOD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ike_owner -d ike"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # The Worker scenarios reach Postgres the way the api does: the Neon driver over the
      # websocket proxy, addressed by the service name the way tools/stack/compose.yml does.
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          APPEND_PORT: ''
          ALLOW_ADDR_REGEX: '^postgres:5432$'
          LOG_TRAFFIC: 'false'
          LOG_CONN_INFO: 'false'
        ports: ['5433:80']
    env:
      DATABASE_OWNER_URL: postgres://ike_owner:ci-owner@localhost:5432/ike
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eichler/api test:postgres
      - run: pnpm --filter @eichler/scenarios test:postgres

  journeys:
    needs: changes
    if: needs.changes.outputs.journeys_relevant != 'false' && needs.changes.outputs.full_suite == 'true'
    # A 4-core GitHub-hosted runner: the journeys saturate a standard 2-core runner at 4-way.
    # The suite plans one replay cover and balances the shards by fixture size; four shards
    # sit at the floor set by the heaviest replayed journey. The gate reads the matrix as one
    # result.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ike_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: ike
          POSTGRES_HOST_AUTH_METHOD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ike_owner -d ike"
          --health-interval 5s --health-timeout 5s --health-retries 10
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: ike_application
          DB_PASSWORD: local-application
          AUTH_TYPE: plain
          POOL_MODE: transaction
          LISTEN_PORT: '6432'
          MAX_CLIENT_CONN: '500'
          DEFAULT_POOL_SIZE: '16'
          MIN_POOL_SIZE: '0'
          SERVER_IDLE_TIMEOUT: '30'
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          APPEND_PORT: ''
          ALLOW_ADDR_REGEX: '^pgbouncer:6432$'
          LOG_TRAFFIC: 'false'
          LOG_CONN_INFO: 'false'
        ports: ['5433:80']
    env:
      DATABASE_OWNER_URL: postgres://ike_owner:ci-owner@localhost:5432/ike
      VITE_IKE_API_URL: http://localhost:8787
      VITE_API_URL: http://localhost:8787
      VITE_DESK_API_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and boot the API, then run the journeys
        run: |
          pnpm dev:stack --api-only > /tmp/ike-stack.log 2>&1 &
          stack_pid=$!
          trap 'kill -TERM "$stack_pid" 2>/dev/null || true; wait "$stack_pid" || true; cat /tmp/ike-stack.log' EXIT
          ready=false
          for _attempt in $(seq 1 120); do
            kill -0 "$stack_pid" || exit 1
            if curl --fail --silent http://localhost:8787/harness/health; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || exit 1
          JOURNEY_CONCURRENCY=6 JOURNEY_SHARD='${{ matrix.shard }}' pnpm journeys

      - name: Keep journey failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: journey-failure-evidence-${{ strategy.job-index }}
          path: |
            /tmp/ike-stack.log
            packages/scenarios/.journeys/**/*.ledger.jsonl
            packages/scenarios/.journeys/**/projections.json
            packages/scenarios/.journeys/results.json
            packages/scenarios/.journeys/errors.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # The Ike Home and Ike Desk Playwright lanes run on their fixture builds: no API, no
  # database. Each lane's own runner keeps it off the journeys' cores and the other lane's.
  surfaces:
    needs: changes
    if: needs.changes.outputs.journeys_relevant != 'false' && needs.changes.outputs.full_suite == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: desk, shard: '1/2' }
          - { app: desk, shard: '2/2' }
          - { app: borrower-web, shard: '1/2' }
          - { app: borrower-web, shard: '2/2' }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @eichler/${{ matrix.app }} exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: pnpm --filter @eichler/${{ matrix.app }} exec playwright install chromium
      - run: env -u DESK_URL -u BORROWER_WEB_URL pnpm --filter @eichler/${{ matrix.app }} test:e2e --shard=${{ matrix.shard }}
      - name: Keep surface failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surface-failure-evidence-${{ matrix.app }}-${{ strategy.job-index }}
          path: |
            apps/${{ matrix.app }}/test-results/
            apps/${{ matrix.app }}/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  browser-integration:
    needs: changes
    if: needs.changes.outputs.journeys_relevant != 'false' && needs.changes.outputs.full_suite == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eichler/borrower-web exec playwright install chromium
      - run: pnpm test:browser-integration
      - name: Keep browser integration failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: browser-integration-evidence
          path: test-results/browser-integration/
          retention-days: 14
          if-no-files-found: warn

